# Candidate only. No deploy is authorized by this file.
name: voxkin-review
x-base: &base
  image: ${VOXKIN_REVIEW_IMAGE:?immutable qualified image required}
  user: '10001:10001'
  read_only: true
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']
  restart: 'no'
services:
  relay:
    <<: *base
    command: [node, /opt/voxkin/ops/review-gateway/appliance.mjs, relay]
    healthcheck:
      test: [CMD, node, /opt/voxkin/ops/review-gateway/health.mjs, relay]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 180s
    stop_grace_period: 130s
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.25
    pids_limit: 32
    volumes:
      - ./egress:/egress
      - ./budget:/budget
      - ./secrets/openai.key:/run/secrets/openai.key:ro
  gateway:
    <<: *base
    command: [node, /opt/voxkin/ops/review-gateway/appliance.mjs, gateway]
    healthcheck:
      test: [CMD, node, /opt/voxkin/ops/review-gateway/health.mjs, gateway]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 180s
    depends_on: [relay]
    network_mode: none
    stop_grace_period: 360s
    mem_limit: 3g
    memswap_limit: 3g
    cpus: 1
    pids_limit: 128
    environment:
      TMPDIR: /run/voice-tmp
      REVIEW_EXPIRES_AT: ${REVIEW_EXPIRES_AT:?fixed expiry milliseconds required}
    tmpfs:
      - /home/voxkin:rw,noexec,nosuid,nodev,size=128m,uid=10001,gid=10001,mode=0700
      - /tmp:rw,noexec,nosuid,nodev,size=512m,mode=1777
      - /run/voice-tmp:rw,exec,nosuid,nodev,size=64m,uid=10001,gid=10001,mode=0700
    volumes:
      - ./egress:/egress:ro
      - ./ingress:/ingress
      - ./state:/home/voxkin/review
      - ./secrets/reviewer.key:/run/secrets/reviewer.key:ro
  ingress:
    <<: *base
    command: [node, /opt/voxkin/ops/review-gateway/appliance.mjs, ingress]
    healthcheck:
      test: [CMD, node, /opt/voxkin/ops/review-gateway/health.mjs, ingress]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 180s
    depends_on: [gateway]
    stop_grace_period: 130s
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.25
    pids_limit: 32
    ports: ['127.0.0.1:18149:8080']
    volumes:
      - ./ingress:/ingress:ro
